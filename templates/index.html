<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Agent Storage Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans leading-normal tracking-normal">
    <div class="container mx-auto p-6">
        <header class="mb-8 border-b border-slate-700 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-emerald-400">🛡️ Agent Storage Portal</h1>
                <p class="text-slate-400 text-sm">Turso Cloud DB Monitoring & Management Panel</p>
            </div>
            <span class="bg-emerald-900 text-emerald-300 text-xs px-3 py-1 rounded-full border border-emerald-700">Connected to Turso Cloud</span>
        </header>

        <!-- Add Project Test Form -->
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg mb-8 border border-slate-700">
            <h2 class="text-xl font-semibold mb-4 text-cyan-400">➕ Test Add Project</h2>
            <form id="projectForm" class="grid grid-cols-1 md:grid-cols-3 gap-4" onsubmit="submitProject(event)">
                <input type="text" id="name" placeholder="Project Name (e.g., MyPythonApp)" required class="bg-slate-900 border border-slate-700 rounded p-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                <input type="text" id="description" placeholder="Description" required class="bg-slate-900 border border-slate-700 rounded p-2 text-slate-100 focus:outline-none focus:border-emerald-500">
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-4 rounded transition">Save to Cloud DB</button>
            </form>
        </div>

        <!-- Data Tables Grid -->
        <div class="grid grid-cols-1 gap-8">
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
                <h2 class="text-xl font-semibold mb-4 text-cyan-400">📂 Projects Table</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-700 text-slate-400">
                                <th class="p-3">ID</th>
                                <th class="p-3">Name</th>
                                <th class="p-3">Description</th>
                                <th class="p-3">Created At</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for p in projects %}
                            <tr class="border-b border-slate-700/50">
                                <td class="p-3">{{ p.id }}</td>
                                <td class="p-3 font-medium text-emerald-300">{{ p.name }}</td>
                                <td class="p-3 text-slate-300">{{ p.description }}</td>
                                <td class="p-3 text-slate-400 text-sm">{{ p.created_at }}</td>
                            </tr>
                            {% else %}
                            <tr><td colspan="4" class="p-4 text-center text-slate-500">No projects found.</td></tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function submitProject(event) {
            event.preventDefault();
            const name = document.getElementById('name').value;
            const description = document.getElementById('description').value;

            const response = await fetch('/add_project', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, description })
            });

            if (response.ok) {
                window.location.reload();
            } else {
                alert('Error saving project!');
            }
        }
    </script>
</body>
</html>
